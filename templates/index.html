<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urna Eletrônica</title>
    <link rel="stylesheet" href="../static/style.css" />
  </head>
  <body>
    <header>
      <h1 class="header-title">
        Urna Eletrônica<br />
        <span class="page-title">Eleições Gerais 1° Turno - Brasil</span>
      </h1>
    </header>
    <main>
      <div class="principal">
        <div class="tela-urna">
          <div class="simulacao">
            SIMULAÇÃO
            <img src="../assets/bateria.jpg" alt="" />
          </div>
          <div class="input">
            Deputado Federal
            <div>
              <input type="number" name="" id="" />
              <input type="number" name="" id="" />
              <input type="number" name="" id="" />
              <input type="number" name="" id="" />
            </div>
          </div>
        </div>
        <div class="teclado-urna">
          <div class="grid-buttons">
            <div class="teclas">1</div>
            <div class="teclas">2</div>
            <div class="teclas">3</div>
            <div class="teclas">4</div>
            <div class="teclas">5</div>
            <div class="teclas">6</div>
            <div class="teclas">7</div>
            <div class="teclas">8</div>
            <div class="teclas">9</div>
            <div class="teclas">0</div>
          </div>
          <div class="botao">
            <button type="submit" id="branco">BRANCO</button>
            <button type="reset" id="corrigir">CORRIGIR</button>
            <button type="submit" id="confirmar">CONFIRMAR</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
