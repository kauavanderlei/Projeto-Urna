<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urna Eletrônica</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header>
      <h1 class="header-title">
        Urna Eletrônica<br />
        <span class="page-title">Eleições Gerais 1° Turno - Brasil</span>
      </h1>
    </header>
    <main>
      <!-- Formulário envolvendo toda a Urna para envio dos dados ao Flask -->
      <form id="form-urna" method="POST" class="principal">
        
        <!-- Campo oculto para armazenar o valor final do voto -->
        <input type="hidden" name="voto" id="campo-voto" value="" />

        <div class="tela-urna">
          <div class="simulacao">
            SIMULAÇÃO
          </div>
          <div class="input">
            Presidente
            <div class="caixas-digito">
              <!-- Inputs do tipo text com readonly para aceitarem apenas cliques do teclado virtual -->
              <input type="text" class="digito" maxlength="1" readonly />
              <input type="text" class="digito" maxlength="1" readonly />
            </div>
          </div>
        </div>

        <div class="teclado-urna">
          <div class="grid-buttons">
            <button type="button" class="teclas">1</button>
            <button type="button" class="teclas">2</button>
            <button type="button" class="teclas">3</button>
            <button type="button" class="teclas">4</button>
            <button type="button" class="teclas">5</button>
            <button type="button" class="teclas">6</button>
            <button type="button" class="teclas">7</button>
            <button type="button" class="teclas">8</button>
            <button type="button" class="teclas">9</button>
            <button type="button" class="teclas">0</button>
          </div>
          <div class="botao">
            <button type="button" id="branco">BRANCO</button>
            <button type="button" id="corrigir">CORRIGIR</button>
            <button type="submit" id="confirmar">CONFIRMAR</button>
          </div>
        </div>

      </form>
    </main>

    <!-- Script único apontando para a pasta static -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
